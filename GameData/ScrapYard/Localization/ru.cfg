		// Addon specific
		#SYD-Agency-titl = «Канфорд и сыновья»
		#SYD-Agency-desc = Канфорд Керман — вдовец и ловкач, промышляющий хламом. Много эпох назад он открыл свалку «Канфорд и сыновья». Канфорд — тот ещё тип: сварливый, язвительный, хитроватый и вспыльчивый. Его гениальные идеи «быстро разбогатеть» вечно заканчиваются эпичным провалом.
		#SYD-Agency-descR = Канфорд Керман — вдовец и ловкач, промышляющий хламом. Много эпох назад он открыл свалку «Канфорд и сыновья». Канфорд — тот ещё тип: сварливый, язвительный, хитроватый и вспыльчивый. Его гениальные идеи «быстро разбогатеть» вечно заканчиваются эпичным провалом.

